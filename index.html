<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora de Huella de Carbono</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f2f6f5;
margin:0;
}

header{
background:#2e7d32;
color:white;
text-align:center;
padding:25px;
}

.container{
width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
margin-bottom:25px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

label{
display:block;
margin-top:10px;
}

input{
width:100%;
padding:8px;
margin-top:5px;
}

button{
margin-top:20px;
padding:12px;
width:100%;
background:#43a047;
color:white;
border:none;
border-radius:5px;
font-size:16px;
}

button:hover{
background:#388e3c;
}

.results{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
margin-top:20px;
}

.result-card{
background:#e8f5e9;
padding:15px;
border-radius:8px;
text-align:center;
}

.result-number{
font-size:24px;
font-weight:bold;
}

</style>
</head>

<body>

<header>
<h1>Calculadora de Huella de Carbono</h1>
<p>Estimación de emisiones personales</p>
</header>

<div class="container">

<div class="card">

<h2>Emisiones directas</h2>

<label>Kilómetros en coche por semana</label>
<input id="carro" type="number">

<label>Gas doméstico (kWh por mes)</label>
<input id="gas" type="number">

</div>

<div class="card">

<h2>Emisiones indirectas</h2>

<label>Electricidad (kWh por mes)</label>
<input id="electricidad" type="number">

<label>Kilómetros en transporte público</label>
<input id="bus" type="number">

</div>

<div class="card">

<button onclick="calcular()">Calcular huella</button>

<div class="results">

<div class="result-card">
<p>Emisiones directas</p>
<div class="result-number" id="directas">0</div>
kg CO₂
</div>

<div class="result-card">
<p>Emisiones indirectas</p>
<div class="result-number" id="indirectas">0</div>
kg CO₂
</div>

<div class="result-card">
<p>Total</p>
<div class="result-number" id="total">0</div>
kg CO₂
</div>

</div>

</div>

</div>

<script>

function calcular(){

let carro = Number(document.getElementById("carro").value);
let gas = Number(document.getElementById("gas").value);
let electricidad = Number(document.getElementById("electricidad").value);
let bus = Number(document.getElementById("bus").value);

/* factores de emisión */

let f_carro = 0.192;
let f_gas = 0.202;
let f_electricidad = 0.233;
let f_bus = 0.105;

/* cálculos */

let directas = (carro * f_carro) + (gas * f_gas);
let indirectas = (electricidad * f_electricidad) + (bus * f_bus);
let total = directas + indirectas;

/* mostrar resultados */

document.getElementById("directas").innerText = directas.toFixed(2);
document.getElementById("indirectas").innerText = indirectas.toFixed(2);
document.getElementById("total").innerText = total.toFixed(2);

}

</script>

</body>
</html>
